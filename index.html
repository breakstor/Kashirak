<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تسوق بسهولة من متجرك المفضل">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" id="apple-title" content="كافي أونلاين">
  <link rel="apple-touch-icon" id="apple-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title id="page-title">كافي أونلاين</title>
  <link rel="manifest" id="manifest-placeholder" href="manifest.json">

  <script>
    (async function() {
      try {
        const slug = window.location.pathname.replace(/^\//, '').split('/')[0];
        if (!slug) return;

        const SUPABASE_URL = 'https://kmkthmaztyhhvxkousmd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtva3RobWF6dHloaHZ4a291c21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM2ODcyMzIsImV4cCI6MjA1OTI2MzIzMn0.dFwjCmf7P4WpfFCwJG-IzVkPAl7ZzWVQqxuR4LFkKR8';

        const res = await fetch(
          ${SUPABASE_URL}/rest/v1/store_settings?slug=eq.&select=store_name,logo_url,slug&limit=1,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
            }
          }
        );
        const data = await res.json();
        if (!data || data.length === 0) return;

        const store = data[0];
        const storeName = store.store_name || 'كافي أونلاين';
        const logoUrl = store.logo_url || null;
        const storeSlug = store.slug || slug;
        const startUrl = '/' + storeSlug;

        // Update page title and apple meta
        document.getElementById('page-title').textContent = storeName;
        document.getElementById('apple-title').setAttribute('content', storeName);
        if (logoUrl) {
          document.getElementById('apple-icon').setAttribute('href', logoUrl);
        }

        // Build dynamic manifest
        const icons = logoUrl
          ? [
              { src: logoUrl, sizes: '192x192', type: 'image/png' },
              { src: logoUrl, sizes: '512x512', type: 'image/png' },
              { src: logoUrl, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
              { src: logoUrl, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ]
          : [
              { src: 'icons/Icon-192.png', sizes: '192x192', type: 'image/png' },
              { src: 'icons/Icon-512.png', sizes: '512x512', type: 'image/png' }
            ];

        const manifest = {
          name: storeName,
          short_name: storeName,
          start_url: startUrl,
          display: 'standalone',
          background_color: '#ffffff',
          theme_color: '#ffffff',
          description: 'تسوق بسهولة من متجرك المفضل',
          orientation: 'portrait-primary',
          prefer_related_applications: false,
          lang: 'ar',
          dir: 'rtl',
          icons: icons
        };

        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(blob);
        document.getElementById('manifest-placeholder').setAttribute('href', manifestUrl);
      } catch (e) {
        console.warn('[PWA Manifest] Could not load dynamic manifest:', e);
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
